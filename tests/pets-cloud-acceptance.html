<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寵物雲端獨立驗收</title>
<style>body{font:18px system-ui;max-width:760px;margin:32px auto;padding:16px;line-height:1.7}button{font:inherit;padding:12px;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef2ff;padding:16px}</style>
<h1>寵物雲端獨立驗收</h1><p>使用目前 Google 登入，建立只有虛構資料的獨立測試路徑。不修改正式班級名冊、分數或班級清單。測試資料保留供重查。</p>
<p id="account">確認登入中…</p><button id="run" disabled>執行獨立雲端往返驗收</button><pre id="result" role="status">尚未執行</pre>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// 分頁隔離：不讀寫正式 localStorage；Firebase Auth 沿用 SDK 的 IndexedDB 登入。
class TestStorage {constructor(){this.data=new Map()}getItem(k){return this.data.get(k)??null}setItem(k,v){this.data.set(k,String(v))}removeItem(k){this.data.delete(k)}key(i){return [...this.data.keys()][i]??null}get length(){return this.data.size}}
Object.defineProperty(window,'Storage',{value:TestStorage});Object.defineProperty(window,'localStorage',{value:new TestStorage()});
const testClass='pet-qa-'+crypto.randomUUID();localStorage.setItem('currentClassId',testClass);
window.STUDENTS_KEY='students-'+testClass;window.GROUPS_KEY='groups-'+testClass;window.POINTS_HISTORY_KEY='pointsHistory-'+testClass;
window.students=[];window.groups=[];window.pointsHistory=[];window.homeworkChecks={};window.notebookEntries=[];window.homeworkList=[];window.lotteryHistory=[];
window.NotificationSystem={success(){},error(m){document.getElementById('result').textContent=m},warning(){}};
</script>
<script src="../js/class-aware-storage.js?v=3.35.0"></script><script src="../js/firebase-config.js?v=3.35.0"></script><script>FirebaseConfig.signIn=()=>new Promise(resolve=>FirebaseConfig.onAuthStateChanged(()=>{if(!FirebaseConfig.isGoogleUser())document.getElementById('account').textContent='請先在正式網站登入 Google，再重新整理本頁。';resolve(FirebaseConfig.getCurrentUserId());}));</script><script src="../js/firebase-sync.js?v=3.35.0"></script><script src="../js/class-pets.js?v=3.35.0"></script>
<script>
// 使用正式同步 helper；不呼叫全班同步或名冊寫入。
const ready=setInterval(()=>{if(!FirebaseConfig.isConnected()||!FirebaseConfig.isGoogleUser())return;clearInterval(ready);document.getElementById('account').textContent='已登入；僅測試虛構資料';document.getElementById('run').disabled=false;},500);
document.getElementById('run').onclick=async()=>{
 const out=document.getElementById('result'),button=document.getElementById('run');button.disabled=true;out.textContent='測試中…';
 const check=(ok,message)=>{if(!ok)throw Error(message)};
 try{
 check(localStorage.getItem('currentClassId')===testClass && testClass.startsWith('pet-qa-'),'測試路徑不符');
 window.students=[{id:1,name:'虛構驗收學生',number:1,points:0,classPet:'panda'}];window.groups=[];window.pointsHistory=[];
 localStorage.setItem(STUDENTS_KEY,JSON.stringify(students));localStorage.setItem(GROUPS_KEY,'[]');localStorage.setItem(POINTS_HISTORY_KEY,'[]');localStorage.setItem('petSettings',JSON.stringify({enabled:true,coinsEnabled:true,rules:[{id:'qa-rule',name:'驗收任務',points:10,xp:10,coins:7}]}));
 ClassPets.prepare();check(await ClassPets.award([1],10,'驗收任務',10,undefined,7),'本機發放失敗');const revealedKind=students[0].classPet;check(students[0].classPetRevealed&&revealedKind,'盲盒未揭曉');check(await ClassPets.setPetMood(1,'happy'),'表情儲存失敗');
 const results=await Promise.all([uploadCollection('students',students),uploadCollection('pointsHistory',pointsHistory),uploadSingleDoc('appSettings','pets',{data:ClassPets.settings()})]);check(results.every(Boolean),'雲端寫入失敗');
 const server=await getUserCollection('students').doc('1').get({source:'server'});check(server.exists&&server.data().classPet===revealedKind&&server.data().classPetRevealed===true&&server.data().classPetMood==='happy'&&server.data().points===10,'伺服器讀回不符');
 const restored={students:await downloadCollection('students'),pointsHistory:await downloadCollection('pointsHistory'),groups:[],petSettings:(await downloadSingleDoc('appSettings','pets')).data,notebookEntries:[],homeworkList:[],lotteryHistory:[],homeworkChecks:{}};
 window.students=[];window.pointsHistory=[];check(await loadFromCloudData(restored),'正式還原函式失敗');
 check(students[0].classPet===revealedKind&&students[0].classPetRevealed===true&&students[0].classPetMood==='happy'&&ClassPets.xpFor(1)===10&&ClassPets.coinsFor(1)===7&&ClassPets.settings().coinsEnabled&&ClassPets.settings().rules[0].coins===7&&ClassPets.settings().rules[0].name==='驗收任務','還原後寵物或規則不符');
 let otherOwnerDenied=false;try{await FirebaseConfig.getDb().collection('users').doc('pet-qa-non-owner').collection('classes').doc(testClass).collection('pointsHistory').get({source:'server'});}catch(e){otherOwnerDenied=e.code==='permission-denied';}check(otherOwnerDenied,'其他帳號路徑未被權限阻擋');
 const ownerPath=getUserCollection('pointsHistory').path;check(ownerPath==='users/'+FirebaseConfig.getCurrentUserId()+'/classes/'+testClass+'/pointsHistory','雲端帳號或班級路徑不符');
 ClassPets.prepare();check(await ClassPets.saveProduct({name:'虛構兌換商品',cost:3}),'商品儲存失敗');const product=ClassPets.settings().products[0];check(await ClassPets.redeem(1,product.id,3),'兌換失敗');const purchase=pointsHistory[0].id;
 check((await Promise.all([uploadCollection('pointsHistory',pointsHistory),uploadSingleDoc('appSettings','pets',{data:ClassPets.settings()})])).every(Boolean),'商店上傳失敗');
 const remotePurchase=await getUserCollection('pointsHistory').doc(purchase).get({source:'server'});check(remotePurchase.exists&&remotePurchase.data().coinDelta===-3,'伺服器未收到兌換');
 restored.pointsHistory=await downloadCollection('pointsHistory');restored.petSettings=(await downloadSingleDoc('appSettings','pets')).data;check(await loadFromCloudData(restored),'商店還原失敗');check(ClassPets.coinsFor(1)===4&&ClassPets.xpFor(1)===10&&ClassPets.settings().products[0].cost===3,'還原後商品或餘額錯誤');
 ClassPets.prepare();check(await ClassPets.refund(purchase),'退幣失敗');check(await uploadCollection('pointsHistory',pointsHistory),'退幣上傳失敗');const refunded=await downloadCollection('pointsHistory');check(ClassPets.coinsFor(1,refunded)===7&&refunded.filter(r=>r.petReverses===purchase).length===1,'退幣讀回錯誤');
 const firstKey=localStorage.getItem('currentClassId');localStorage.setItem('currentClassId',testClass+'-other');check(localStorage.getItem('petSettings')===null,'另一班讀到設定');const other=await downloadCollection('pointsHistory');check(other.length===0,'另一班讀到紀錄');localStorage.setItem('currentClassId',firstKey);
 ClassPets.prepare();check(await ClassPets.undo([pointsHistory.find(r=>r.petEvent&&!r.petShopType&&!r.petReverses).id]),'撤銷失敗');check((await Promise.all([uploadCollection('pointsHistory',pointsHistory),uploadCollection('students',students)])).every(Boolean),'撤銷上傳失敗');const after=await downloadCollection('pointsHistory');check(ClassPets.xpFor(1,after)===0&&ClassPets.coinsFor(1,after)===0&&after.some(r=>r.petReverses),'雲端撤銷紀錄不符');
 out.textContent='通過：登入老師帳號路徑與跨帳號讀取拒絕確認、商品／兌換／退幣伺服器讀回、盲盒抽選結果與表情樣態、成長與獨立金幣還原、自訂規則金額還原、另一班設定與紀錄隔離、撤銷紀錄雲端讀回。\n測試班 ID：'+testClass+'\n虛構學生：1 人；保留 4 筆獎勵／兌換／退幣／撤銷紀錄。正式班級未改動。';
 }catch(e){out.textContent='未通過：'+e.message+'\n測試班 ID：'+testClass;}finally{button.disabled=false;}
};
</script></html>
