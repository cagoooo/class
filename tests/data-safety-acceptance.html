<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>班級成果安全驗收</title>
<link rel="stylesheet" href="../css/data-safety.css?v=3.36.6"><style>body{font:17px system-ui;max-width:850px;margin:auto;padding:18px;line-height:1.65;background:#f3f7fa;color:#172033}button,input{font:inherit;max-width:100%;box-sizing:border-box}button{min-height:46px;padding:10px;margin:5px;border:1px solid #789;border-radius:8px;background:white}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:14px;background:white}dialog{max-width:calc(100vw - 32px);border-radius:12px}nav{display:flex;flex-wrap:wrap}#status{border-left:4px solid #059669}label{display:block;padding:8px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head><body><h1>班級成果安全驗收</h1><p>僅使用 48 位虛構學生。每個裝置使用獨立分頁儲存；雲端只寫入 safety-qa 開頭的測試班，不加入正式班級清單。</p><p id="account">確認 Google 登入中…</p><p id="device"></p>
<nav><button id="seed">建立 48 人測試成果</button><button id="add">本機新增 +3 成長／+2 金幣</button><button id="upload" disabled>同步這台裝置</button><button id="restore" disabled>讀取並還原測試雲端</button><button id="conflict" disabled>比較同步差異</button><button id="export">下載完整 Excel</button><button id="roundtrip">檢查 Excel 二進位往返</button><button id="mutate">變更測試資料以驗證還原</button><button id="recovery">下載還原前副本</button></nav>
<label>匯入剛下載的 Excel <input id="import" type="file" accept=".xlsx,.json"></label><pre id="status" role="status"></pre><pre id="result" role="status">尚未執行</pre>
<script>
const args=new URLSearchParams(location.search);const run=args.get('run')||'manual';if(!/^[a-zA-Z0-9-]{1,60}$/.test(run))throw Error('測試識別不符');const device=args.get('device')==='B'?'B':'A';const testClass='safety-qa-'+run;const nativeSession=window.sessionStorage;const storageKey='safety-qa-'+run+'-'+device;
class TestStorage{constructor(){this.data=JSON.parse(nativeSession.getItem(storageKey)||'{}')}getItem(k){return Object.hasOwn(this.data,k)?this.data[k]:null}setItem(k,v){this.data[k]=String(v);this.flush()}removeItem(k){delete this.data[k];this.flush()}key(i){return Object.keys(this.data)[i]??null}get length(){return Object.keys(this.data).length}flush(){nativeSession.setItem(storageKey,JSON.stringify(this.data))}}
Object.defineProperty(window,'Storage',{value:TestStorage});Object.defineProperty(window,'localStorage',{value:new TestStorage()});localStorage.setItem('currentClassId',testClass);
window.STUDENTS_KEY='students-'+testClass;window.GROUPS_KEY='groups-'+testClass;window.POINTS_HISTORY_KEY='pointsHistory-'+testClass;
window.students=JSON.parse(localStorage.getItem(STUDENTS_KEY)||'[]');window.groups=JSON.parse(localStorage.getItem(GROUPS_KEY)||'[]');window.pointsHistory=JSON.parse(localStorage.getItem(POINTS_HISTORY_KEY)||'[]');window.notebookEntries=[];window.homeworkList=[];window.lotteryHistory=[];window.homeworkChecks={};
window.ClassProfiles={currentProfile:()=>({id:testClass,name:'成果驗收 '+device})};window.PointsReset={lastResetId:()=>0,sinceReset:h=>h,isReset:r=>r.type==='reset'};
const output=m=>{document.getElementById('result').textContent=m;};window.NotificationSystem={success:output,error:output,warning:output,info:output};window.LoadingIndicator={show(){},hide(){}};
window.ConfirmDialog={show:opts=>new Promise(resolve=>{const d=document.createElement('dialog'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=opts.title;p.textContent=opts.message;d.append(h,p);for(const row of opts.details||[]){const line=document.createElement('p');line.textContent=row.label+'：'+row.value;d.append(line)}for(const [label,result]of [[opts.confirmText||'確定',true],['取消',false]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{d.close();d.remove();resolve(result)};d.append(b)}d.oncancel=()=>{d.remove();resolve(false)};document.body.append(d);d.showModal()})};
</script>
<script src="../js/class-aware-storage.js?v=3.36.6"></script><script src="../js/backup-integrity.js?v=3.36.6"></script><script src="../js/data-backup.js?v=3.36.6"></script><script src="../js/firebase-config.js?v=3.36.6"></script><script src="../js/cloud-safety.js?v=3.36.6"></script><script src="../js/class-pets.js?v=3.36.6"></script>
<script>
function persist(){for(const k of ['students','groups','pointsHistory'])localStorage.setItem(k==='students'?STUDENTS_KEY:k==='groups'?GROUPS_KEY:POINTS_HISTORY_KEY,JSON.stringify(window[k]));ClassPets.prepare();renderStatus()}
function renderStatus(){document.getElementById('status').textContent=`裝置 ${device}｜${navigator.onLine?'連線中':'離線'}｜${CloudSafety.status()}\n${students.length} 人・${pointsHistory.length} 筆紀錄\n第一位：${students[0]?.classPet||'尚未建立'}・${students[0]?.classPetMood||''}・分數 ${students[0]?.points||0}・成長 ${ClassPets.xpFor(1)}・金幣 ${ClassPets.coinsFor(1)}\n商品數：${(ClassPets.settings().products||[]).length}・圖鑑 ${Object.keys(ClassPets.collectionFor()).length} / 30`;}
window.renderStudents=renderStatus;window.SyncStatusIndicator={setState:renderStatus,updateStateBasedOnSync:renderStatus};document.getElementById('device').textContent='裝置 '+device+'｜測試班 '+testClass;
function action(id,fn){document.getElementById(id).onclick=async()=>{try{await fn();renderStatus()}catch(e){output('已保護原資料：'+e.message);renderStatus()}}}
action('seed',async()=>{students=Array.from({length:48},(_,i)=>({id:i+1,name:'虛構學生 '+String(i+1).padStart(2,'0'),number:i+1,points:10,classPet:i?'cat':'unicorn',classPetRevealed:true,classPetMood:'happy',petCarryXp:i?0:4,petCarryCoins:i?0:2}));groups=[];pointsHistory=students.map(s=>({id:'earn-'+s.id,studentId:s.id,studentName:s.name,points:10,petEvent:true,petXp:10,coinDelta:7,reason:'努力 🥚'}));pointsHistory.push({id:'buy',studentId:1,points:0,petEvent:true,petXp:0,coinDelta:-3,petShopType:'purchase',productId:'gift',productName:'獎勵'},{id:'refund',studentId:1,points:0,petEvent:true,petXp:0,coinDelta:3,petReverses:'buy'});localStorage.setItem('petSettings',JSON.stringify({enabled:true,coinsEnabled:true,rules:[{id:'r',name:'努力',points:1,xp:3,coins:2}],products:[{id:'gift',name:'虛構獎勵',cost:3,active:true}]}));localStorage.setItem('boardNote','🦄完整備份🥚'.repeat(6000));persist();output('已建立隔離的 48 人成果，含孵化、期初成長、兌換與退幣')});
action('add',async()=>{ClassPets.prepare();if(!await ClassPets.award([1],1,'離線努力',3,undefined,2))throw Error('加分未完成');output('新增成果已存本機')});
action('upload',async()=>{try{await CloudSafety.publish(testClass);output('雲端完整版本已提交')}catch(e){await CloudSafety.report(e,testClass,true);throw e}});
action('restore',async()=>{const data=await CloudSafety.read(testClass);if(data.empty)throw Error('測試雲端仍是空的');if(!await CloudSafety.restore(data))throw Error('還原未完成');output('完整還原成功；本機舊資料已保留副本')});
action('conflict',()=>CloudSafety.showConflict(testClass));action('export',()=>DataBackup.export());action('recovery',()=>CloudSafety.downloadRecovery());
action('mutate',async()=>{students[0].points=999;students[0].classPet='frog';pointsHistory=[];localStorage.setItem('petSettings',JSON.stringify({enabled:false,rules:[]}));persist();output('只變更驗收資料，等待從 Excel 還原')});
action('roundtrip',async()=>{const expected=DataBackup.collectData();let captured;const original=XLSX.writeFile;try{XLSX.writeFile=wb=>{captured=XLSX.write(wb,{type:'array',bookType:'xlsx'})};DataBackup.exportExcel(expected)}finally{XLSX.writeFile=original}const actual=DataBackup.extractDataFromWorkbook(XLSX.read(captured,{type:'array'}));if(JSON.stringify(expected)!==JSON.stringify(actual))throw Error('往返資料不同');output(`通過：真正 XLSX 二進位寫入／讀回逐欄相同，包含 ${actual.students.length} 人、${actual.pointsHistory.length} 筆帳本、${Object.keys(actual.petSettings?.collection || {}).length} 種圖鑑、期初值、寵物種類與表情、金幣、兌換退幣、商品及跨分段 emoji`)});
document.getElementById('import').onchange=async e=>{if(e.target.files[0])await DataBackup.import(e.target.files[0]);};
FirebaseConfig.initialize().then(()=>FirebaseConfig.onAuthStateChanged(()=>renderStatus()));const ready=setInterval(()=>{if(FirebaseConfig.isConnected()&&FirebaseConfig.isGoogleUser()){clearInterval(ready);document.getElementById('account').textContent='Google 已登入；僅使用隔離測試路徑';for(const id of ['upload','restore','conflict'])document.getElementById(id).disabled=false;renderStatus();}},500);
window.addEventListener('online',renderStatus);window.addEventListener('offline',renderStatus);renderStatus();
</script></body></html>
