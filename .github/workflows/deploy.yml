name: Deploy to GitHub Progress 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# 主動讓所有 actions 使用 Node.js 24 執行
# GitHub 會於 2026-06-02 起預設為 Node 24，Node 20 於 2026-09-16 移除
# 主動 opt-in 可提早發現相容性問題並消除 workflow log 的 deprecation 警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check classroom data safety
        run: |
          node scripts/test-class-pets.cjs
          node scripts/test-class-switch-catchup.cjs
          node scripts/test-pet-share.cjs
          node scripts/test-pet-notify.cjs
          node scripts/test-usage-digest.cjs
          node scripts/test-data-safety.cjs
          node scripts/test-cloud-merge.cjs
          node scripts/test-fast-forward.cjs
          node scripts/test-critical-update.cjs
          node scripts/test-pet-sync.cjs
          node scripts/test-leave-sync-guard.cjs
          node scripts/test-exam-proctor-noop.cjs
          node scripts/test-error-handler.cjs
          node scripts/test-error-report-privacy.cjs
          node scripts/test-google-only-sync.cjs
          node scripts/test-quiet-challenge.cjs
          node scripts/test-late-signin.cjs
          node scripts/test-sync-status.cjs
          node scripts/test-semester-archive.cjs
          node scripts/test-purge-backup.cjs
          node scripts/test-snapshot-prune.cjs
          node scripts/test-source-app.cjs
          node scripts/test-site-publish-scope.cjs

      - name: Inject Secrets 💉
        run: python .github/inject.py
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Setup Pages ⚙️
        uses: actions/configure-pages@v4

      # 只發布網站需要的檔案（頁面、js、css、圖片）。以前上傳整個 repo，雲端函式原始碼、
      # 測試腳本、說明文件、資料庫規則都能從網站網址讀到。清單在 scripts/build-site.cjs。
      # 一定要排在注入金鑰之後：要發布的是注入過的檔案。
      - name: Build site folder 📦
        run: node scripts/build-site.cjs _site

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      # 檔案包剛上傳完的幾秒內，GitHub 還查不到它；馬上發布會回報
      # 「No artifacts named github-pages were found」而失敗（2026-11-24 連續發生三次）。
      - name: Wait for the artifact to be listed ⏳
        run: sleep 20

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
